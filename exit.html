<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exit System - Sunrise Dental Clinic</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-100 via-rose-50/40 to-slate-200 min-h-screen font-['Inter'] flex flex-col justify-between">

    <!-- Shared Header -->
    <div id="shared-header"></div>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4 py-16">
        <div class="max-w-md w-full bg-white/90 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white text-center">
            
            <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 animate-bounce">
                <i class="fa-solid fa-power-off"></i>
            </div>

            <h1 class="text-2xl font-bold text-slate-900">Exit System & Logout</h1>
            <p class="text-xs text-slate-500 mt-1 mb-6">
                Are you sure you want to safely exit Sunrise Dental Clinic System? This will clear active staff session credentials.
            </p>

            <div class="space-y-3">
                <button onclick="confirmExit()" class="w-full py-3.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl text-xs transition-all shadow-lg shadow-rose-500/20 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Yes, Safely Log Out & Exit</span>
                </button>
                <a href="dashboard.html" class="w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs transition-all block">
                    Cancel & Return to Dashboard
                </a>
            </div>

            <div class="mt-8 text-[11px] text-slate-400">
                Patient records and text files have been saved via Singleton <code>DatabaseConnectionManager</code>.
            </div>

        </div>
    </main>

    <!-- Shared Footer -->
    <div id="shared-footer"></div>

    <script>
        function confirmExit() {
            sessionStorage.removeItem('clinic_user');
            sessionStorage.removeItem('clinic_role');
            document.cookie = "clinic_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = 'login.html';
        }
    </script>
    <script src="shared-nav.js"></script>
</body>
</html>
